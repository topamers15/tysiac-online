<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra w Tysiąca - Stół do Gry</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- EKRAN LOGOWANIA -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h1>🎴 Tysiąc Online</h1>
            <p>Wpisz swój nick, aby dołączyć do stolika:</p>
            <input type="text" id="player-name" placeholder="Twój nick..." maxlength="15" />
            <button id="join-btn">Dołącz do gry</button>
        </div>
    </div>

    <!-- EKRAN GRY -->
    <div id="game-screen" class="screen" style="display: none;">
        <!-- PASKI INFORMACYJNE (NAGŁÓWEK) -->
        <header class="game-header">
            <div id="round-info" class="badge">Rozdanie: 1</div>
            <div id="score-info" class="badge highlight">Para 1: 0 | Para 2: 0</div>
            <div id="trump-info" class="badge trump">Atut: Brak</div>
        </header>

        <!-- ZIELONY STÓŁ DO GRY -->
        <div class="poker-table">
            <div id="players-container" class="players-grid"></div>

            <div id="table-area">
                <div class="table-label">STÓŁ</div>
                <div id="trick-container" class="cards-flex"></div>
            </div>

            <!-- SEKCJA STEROWANIA I MOJE KARTY -->
            <div class="controls-and-hand">
                <div class="turn-info" id="turn-status">Twoja kolej!</div>

                <div class="buttons-row" id="main-actions">
                    <button id="play-btn" class="btn btn-primary">Zagraj</button>
                    <button id="meld-btn" class="btn btn-success">👑 Meldunek K/Q</button>
                    <button id="declare-meld-btn" class="btn btn-warning">Zgłoś Meldunek</button>
                </div>

                <div id="bidding-actions" class="buttons-row" style="display: none;">
                    <button id="bid-btn" class="btn btn-primary">Licytuj</button>
                    <button id="pass-btn" class="btn btn-danger">Pas</button>
                </div>

                <div id="my-hand-area">
                    <div class="hand-label">TWOJE KARTY</div>
                    <div id="my-hand" class="cards-flex"></div>
                </div>
            </div>
        </div>

        <!-- MODAL DO WYBORU GRACZA DLA PRZEKAZYWANEJ KARTY -->
        <div id="give-card-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <h3>Wybrałeś kartę: <span id="selected-card-name"></span></h3>
                <p>Wybierz gracza, któremu chcesz oddać tę kartę:</p>
                <div id="recipient-buttons" class="recipient-grid"></div>
            </div>
        </div>

        <!-- PANEL DOLNY (CHAT I PRZEBIEG) -->
        <div class="bottom-panel">
            <div class="panel-box log-container">
                <h4>📜 Przebieg gry</h4>
                <div id="log-box"></div>
            </div>
            <div class="panel-box chat-container">
                <h4>💬 Czat</h4>
                <div id="chat-box"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Napisz wiadomość..." />
                    <button id="chat-send-btn">Wyślij</button>
                </div>
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
