<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra w Tysiąca (1000)</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #0b381e; color: #ffffff; margin: 0; padding: 15px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card-panel { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #154d2b; padding: 10px 15px; border-radius: 6px; }
        .players-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .player-card { background: #1e5c36; padding: 10px; border-radius: 6px; text-align: center; border: 2px solid transparent; }
        .player-card.active { border-color: #f1c40f; box-shadow: 0 0 10px #f1c40f; }
        .table-area { background: #082b17; border: 2px dashed #1e5c36; border-radius: 8px; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 15px 0; padding: 10px; }
        .cards-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .card { width: 55px; height: 80px; background: #ffffff; color: #000000; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; cursor: pointer; border: 1px solid #ccc; user-select: none; }
        .card.red { color: #e74c3c; }
        .card.selected { transform: translateY(-12px); border: 2px solid #f1c40f; box-shadow: 0 0 8px #f1c40f; }
        .card-back { background: #b22222; color: #ffffff; font-size: 24px; }
        .actions-bar { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #2980b9; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-dark { background: #34495e; color: white; }
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .log-box, .chat-box { background: #000; height: 120px; overflow-y: auto; padding: 8px; font-size: 12px; font-family: monospace; border-radius: 4px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
        .modal-content { background: #1e5c36; padding: 20px; border-radius: 8px; text-align: center; }
        #admin-console { background: #111; border: 1px solid #f1c40f; padding: 10px; margin-top: 15px; border-radius: 6px; }
        .slider-container { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); padding: 4px 12px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- EKRAN LOGOWANIA -->
        <div id="login-screen" class="card-panel" style="text-align: center;">
            <h2>Dołącz do Gry w Tysiąca</h2>
            <input type="text" id="player-name" placeholder="Twój Login" style="padding: 8px; font-size: 16px;">
            <button id="join-btn" class="btn btn-primary">Dołącz</button>
        </div>

        <!-- EKRAN GRY -->
        <div id="game-screen" style="display: none;">
            <div class="header">
                <span id="round-info">Rozdanie: 1</span>
                <span id="score-info">Ogólny: P1: 0 | P2: 0</span>
                <span id="trump-info">Atut: Brak</span>
                <span id="round-live-score">W tym rozdaniu — P1: 0 | P2: 0</span>
            </div>

            <div id="players-container" class="players-grid"></div>

            <div class="table-area">
                <div id="table-label" style="margin-bottom: 8px; font-size: 13px; color: #aaa;">STÓŁ</div>
                <div id="trick-container" class="cards-row"></div>
            </div>

            <div style="text-align: center; margin-bottom: 8px;">
                <span id="turn-status" style="font-weight: bold; color: #f1c40f;">Czekanie na graczy...</span>
            </div>

            <!-- PRZYCISKI AKCJI -->
            <div class="actions-bar">
                <div id="bidding-actions" style="display: none; align-items: center; gap: 10px;">
                    <div class="slider-container">
                        <label for="bid-slider" style="font-size: 13px;">Stawka:</label>
                        <input type="range" id="bid-slider" min="110" max="300" step="10" value="110" style="cursor: pointer;">
                        <span id="bid-value-display" style="font-weight: bold; color: #f1c40f; min-width: 32px; text-align: right;">110</span>
                    </div>
                    <button id="bid-btn" class="btn btn-primary">Licytuj</button>
                    <button id="pass-btn" class="btn btn-danger">Pas</button>
                </div>
                <div id="main-actions" style="display: none; gap: 8px;">
                    <button id="play-btn" class="btn btn-primary">Zagraj</button>
                    <button id="meld-btn" class="btn btn-warning">Meldunek</button>
                    <button id="take-musik-btn" class="btn btn-success" style="display: none;">Pobierz musik</button>
                    <button id="fold-nines-btn" class="btn btn-danger" style="display: none;">🃏 Zgłoś 4 dziewiątki</button>
                </div>
            </div>

            <!-- MOJE KARTY -->
            <div class="card-panel">
                <div style="font-size: 12px; margin-bottom: 5px;">TWOJE KARTY:</div>
                <div id="my-hand" class="cards-row"></div>
            </div>

            <!-- CHAT I LOGI -->
            <div class="bottom-grid">
                <div class="card-panel">
                    <div style="font-size: 12px; margin-bottom: 4px;">📜 Przebieg gry</div>
                    <div id="log-box" class="log-box"></div>
                </div>
                <div class="card-panel">
                    <div style="font-size: 12px; margin-bottom: 4px;">💬 Czat</div>
                    <div id="chat-box" class="chat-box"></div>
                    <div style="display: flex; gap: 5px; margin-top: 5px;">
                        <input type="text" id="chat-input" style="flex: 1; padding: 4px;" placeholder="Napisz wiadomość...">
                        <button id="chat-send-btn" class="btn btn-dark" style="padding: 4px 10px;">Wyślij</button>
                    </div>
                </div>
            </div>

            <!-- KONSOLA ADMINA (Tylko dla Hosta) -->
            <div id="admin-console" style="display: none;">
                <div style="color: #f1c40f; font-weight: bold; font-size: 12px; margin-bottom: 6px;">🛠 KONSOLA ADMINA (TESTY)</div>
                <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px;">
                    <button class="btn btn-dark" onclick="socket.emit('adminCommand', 'pause')">⏸️ Pauza</button>
                    <button class="btn btn-dark" onclick="socket.emit('adminCommand', 'resume')">▶️ Wznów</button>
                    <button class="btn btn-dark" onclick="socket.emit('adminCommand', 'addpoints 1 100')">+100 P1</button>
                    <button class="btn btn-dark" onclick="socket.emit('adminCommand', 'addpoints 2 100')">+100 P2</button>
                    <button class="btn btn-dark" onclick="socket.emit('adminCommand', 'dealnines 0')">🃏 4x9 dla P1</button>
                </div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="admin-cmd-input" placeholder="Wpisz komendę (np. addpoints 1 50, settrump kier, kick 1)..." style="flex: 1; padding: 4px; font-size: 12px;">
                    <button id="admin-exec-btn" class="btn btn-warning" style="padding: 4px 10px; font-size: 12px;">Wykonaj</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ODDAWANIA KART -->
    <div id="give-card-modal" class="modal">
        <div class="modal-content">
            <h3>Wybrana karta: <span id="selected-card-name"></span></h3>
            <p>Wybierz gracza, któremu chcesz przekazać tę kartę:</p>
            <div id="recipient-buttons" style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
