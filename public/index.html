<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra w Tysiąca</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- EKRAN LOGOWANIA -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h1>Tysiąc Online</h1>
            <p>Wpisz swój nick, aby dołączyć do gry:</p>
            <input type="text" id="player-name" placeholder="Twój nick" maxlength="15" />
            <button id="join-btn">Dołącz do gry</button>
        </div>
    </div>

    <!-- EKRAN GRY -->
    <div id="game-screen" class="screen" style="display: none;">
        <!-- NAGŁÓWEK / INFORMACJE O GRZE -->
        <header class="game-header">
            <div id="round-info">Rozdanie: -</div>
            <div id="score-info">Para 1: 0 | Para 2: 0</div>
            <div id="trump-info">Atut: Brak</div>
        </header>

        <!-- LISTA GRACZY -->
        <div id="players-container" class="players-grid"></div>

        <!-- STÓŁ / KARTY W LEWIE I MUSIK -->
        <div id="table-area">
            <h3>Stół</h3>
            <div id="trick-container" class="cards-flex"></div>
        </div>

        <!-- REKA GRACZA -->
        <div id="my-hand-area">
            <h3>Twoje karty</h3>
            <div id="my-hand" class="cards-flex"></div>
        </div>

        <!-- PANEL AKCJI (dynamicznie generowane przyciski ruchu, meldunku, licytacji) -->
        <div id="actions-container" class="actions-panel"></div>

        <!-- DZIENNIK GRY I CHAT -->
        <div class="bottom-panel">
            <div class="log-container">
                <h4>Przebieg gry</h4>
                <div id="log-box"></div>
            </div>
            <div class="chat-container">
                <h4>Czat</h4>
                <div id="chat-box"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Napisz wiadomość..." />
                    <button id="chat-send-btn">Wyślij</button>
                </div>
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
