<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tysiąc Online z Botami</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #1a261c; color: #fff; margin: 0; padding: 20px; display: flex; gap: 20px; height: 100vh; overflow: hidden; }
        
        /* Ekran logowania */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: #2c3e30; padding: 30px; border-radius: 12px; text-align: center; border: 1px solid #4a6b50; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-box input { padding: 10px; border-radius: 6px; border: none; font-size: 16px; margin-bottom: 15px; width: 200px; text-align: center; }
        .login-box button { padding: 10px 20px; border-radius: 6px; border: none; background: #4a8264; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Główny układ */
        #gameContainer { display: flex; width: 100%; gap: 20px; height: 100%; }
        #mainBoard { flex: 1; background: #233325; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; position: relative; border: 2px solid #2e4532; }
        #sidebar { width: 320px; background: #2c3e30; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #3d5742; }

        /* Stół i Karty */
        .cards-flex { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 110px; }
        .card { width: 70px; height: 100px; background: white; color: black; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 5px; font-weight: bold; font-size: 18px; cursor: pointer; user-select: none; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.1s; }
        .card:hover { transform: translateY(-10px); }
        .card.red { color: #d32f2f; }
        .card.selected { border: 3px solid #ffb74d; transform: translateY(-15px); }
        
        .trick-area { height: 150px; background: rgba(0,0,0,0.2); border-radius: 10px; border: 2px dashed #3d5742; display: flex; justify-content: center; align-items: center; gap: 15px; }

        /* Panele sterowania */
        .controls { background: #1e2b20; padding: 15px; border-radius: 8px; text-align: center; margin-top: 10px; }
        button { padding: 8px 16px; border-radius: 6px; border: none; background: #3d6b4f; color: white; font-weight: bold; cursor: pointer; margin: 4px; }
        button:hover { background: #4f8765; }
        .btn-danger { background: #a83232; }
        .btn-danger:hover { background: #c74040; }

        /* Panel boczny */
        .score-board { background: #1e2b20; padding: 10px; border-radius: 8px; font-size: 14px; }
        .player-list-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #3d5742; }
        .chat-box { flex: 1; background: #1e2b20; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; font-size: 13px; max-height: 200px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
        .chat-input { display: flex; gap: 5px; }
        .chat-input input { flex: 1; padding: 6px; border-radius: 4px; border: none; background: #2c3e30; color: white; }
        .log-box { height: 100px; background: #1e2b20; border-radius: 8px; padding: 8px; font-size: 12px; overflow-y: auto; color: #a5c4ab; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>Gra Tysiąc</h2>
            <input type="text" id="usernameInput" placeholder="Twoje imię" maxlength="12">
            <br>
            <button onclick="login()">Dołącz do gry</button>
        </div>
    </div>

    <div id="gameContainer">
        <div id="mainBoard">
            <!-- Górny pasek gry -->
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="margin: 0;">Rozdanie <span id="roundNum">1</span></h3>
                    <small>Atut: <span id="trumpSuit">Brak</span></small>
                </div>
                <div id="gameStatus" style="font-weight: bold; color: #ffb74d;">Oczekiwanie na graczy...</div>
            </div>

            <!-- Stół / Musik / Lewa -->
            <div>
                <div style="text-align: center; margin-bottom: 5px;"><small>Karty na stole / Musik:</small></div>
                <div class="trick-area" id="trickArea"></div>
            </div>

            <!-- Moja Ręka i Akcje -->
            <div>
                <div id="actionPanel" class="controls"></div>
                <div style="text-align: center; margin: 10px 0 5px 0;"><small>Twoje karty:</small></div>
                <div class="cards-flex" id="myHand"></div>
            </div>
        </div>

        <div id="sidebar">
            <div class="score-board">
                <h4 style="margin: 0 0 8px 0;">Punktacja</h4>
                <div>Para 1 (Gracz 1 & 3): <b id="scoreTeam0">0</b> pkt</div>
                <div>Para 2 (Gracz 2 & 4): <b id="scoreTeam1">0</b> pkt</div>
            </div>

            <div>
                <h4 style="margin: 0 0 8px 0;">Gracze w pokoju</h4>
                <div id="hostPlayerList"></div>
            </div>

            <div class="chat-box">
                <h4 style="margin: 0 0 8px 0;">Czat</h4>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Napisz..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()">></button>
                </div>
            </div>

            <div>
                <h4 style="margin: 0 0 4px 0;">Dziennik zdarzeń</h4>
                <div class="log-box" id="logBox"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let mySeat = -1;
        let selectedCards = [];

        function login() {
            const name = document.getElementById('usernameInput').value.trim();
            if (name) {
                socket.emit('joinGame', name);
                document.getElementById('loginOverlay').style.display = 'none';
            }
        }

        socket.on('assignedSeat', (seat) => {
            mySeat = seat;
        });

        socket.on('fullGame', () => {
            alert('Gra jest pełna!');
            location.reload();
        });

        socket.on('kicked', () => {
            alert('Zostałeś usunięty z pokoju przez Hosta.');
            location.reload();
        });

        socket.on('stateUpdate', (state) => {
            render(state);
        });

        function sendChat() {
            const input = document.getElementById('chatInput');
            if (input.value.trim()) {
                socket.emit('sendChat', input.value);
                input.value = '';
            }
        }

        function toggleCardSelect(cardId) {
            const index = selectedCards.indexOf(cardId);
            if (index > -1) {
                selectedCards.splice(index, 1);
            } else {
                if (selectedCards.length < 3) {
                    selectedCards.push(cardId);
                }
            }
            socket.emit('stateUpdateRequest'); // Opcjonalny odświeżacz lokalny
            const cardEls = document.querySelectorAll('#myHand .card');
            cardEls.forEach(el => {
                const id = el.getAttribute('data-id');
                if (selectedCards.includes(id)) el.classList.add('selected');
                else el.classList.remove('selected');
            });
        }

        function render(state) {
            const me = state.players.find(p => p.seat === mySeat);
            const amIHost = me ? me.isHost : false;

            // Informacje nagłówkowe
            document.getElementById('roundNum').innerText = state.round;
            document.getElementById('trumpSuit').innerText = state.trump || "Brak";
            document.getElementById('scoreTeam0').innerText = state.scores[0];
            document.getElementById('scoreTeam1').innerText = state.scores[1];

            // Renderowanie graczy w panelu bocznym
            const hostListEl = document.getElementById('hostPlayerList');
            let listHTML = state.players.map(p => `
                <div class="player-list-item">
                    <span>${p.isBot ? '🤖' : '👤'} ${p.name} ${p.isHost ? '👑' : ''} ${p.seat === mySeat ? '(Ty)' : ''}</span>
                    ${amIHost && p.seat !== mySeat ? `<button class="btn-kick" style="font-size:10px;padding:2px 5px;" onclick="socket.emit('kickPlayer', ${p.seat})">🔴 Usun</button>` : ''}
                </div>
            `).join('');

            if (amIHost && state.players.length < 4) {
                listHTML += `<button style="width:100%;margin-top:8px;background:#4a8264;color:white;" onclick="socket.emit('addBot')">🤖 ➕ Dodaj Bota</button>`;
            }
            if (amIHost) {
                listHTML += `<button style="width:100%;margin-top:4px;background:#3a5240;" onclick="socket.emit('togglePause')">${state.paused ? '▶ Wzłów' : '⏸ Pauza'}</button>`;
            }

            hostListEl.innerHTML = listHTML;

            // Czat i Logi
            const chatEl = document.getElementById('chatMessages');
            chatEl.innerHTML = state.chat.map(c => `<div>${c}</div>`).join('');
            chatEl.scrollTop = chatEl.scrollHeight;

            const logEl = document.getElementById('logBox');
            logEl.innerHTML = state.log.map(l => `<div>${l}</div>`).join('');

            // Pasek statusu
            const statusEl = document.getElementById('gameStatus');
            if (state.paused) statusEl.innerText = "PAUZA";
            else if (state.phase === "waiting") statusEl.innerText = "Czekamy na 4 graczy...";
            else if (state.phase === "bid") statusEl.innerText = `Licytacja (Ruch: ${state.players[state.bidder]?.name})`;
            else if (state.phase === "exchange") statusEl.innerText = `Wymiana kart (${state.players[state.highestBidder]?.name})`;
            else if (state.phase === "play") statusEl.innerText = `Rozgrywka (Ruch: ${state.players[state.leader]?.name})`;
            else if (state.phase === "next") statusEl.innerText = "Koniec rozdania";

            // Lewa / Musik na stole
            const trickArea = document.getElementById('trickArea');
            if (state.phase === "exchange") {
                trickArea.innerHTML = state.musik.map(c => `
                    <div class="card ${c.red ? 'red' : ''}">
                        <div>${c.rank}</div>
                        <div style="text-align:center;">${c.symbol}</div>
                        <div style="text-align:right;">${c.rank}</div>
                    </div>
                `).join('');
            } else {
                trickArea.innerHTML = state.trick.map(t => `
                    <div style="text-align:center;">
                        <div style="font-size:11px;margin-bottom:2px;">${state.players[t.player].name}</div>
                        <div class="card ${t.card.red ? 'red' : ''}">
                            <div>${t.card.rank}</div>
                            <div style="text-align:center;">${t.card.symbol}</div>
                            <div style="text-align:right;">${t.card.rank}</div>
                        </div>
                    </div>
                `).join('');
            }

            // Moja ręka
            const myHandEl = document.getElementById('myHand');
            if (me && me.hand) {
                myHandEl.innerHTML = me.hand.map(c => `
                    <div class="card ${c.red ? 'red' : ''} ${selectedCards.includes(c.id) ? 'selected' : ''}" data-id="${c.id}" onclick="toggleCardSelect('${c.id}')">
                        <div>${c.rank}</div>
                        <div style="text-align:center;">${c.symbol}</div>
                        <div style="text-align:right;">${c.rank}</div>
                    </div>
                `).join('');
            } else {
                myHandEl.innerHTML = '';
            }

            // Panel Akcji
            const actionPanel = document.getElementById('actionPanel');
            actionPanel.innerHTML = '';

            if (state.paused) {
                actionPanel.innerHTML = '<i>Gra wstrzymana przez Hosta</i>';
                return;
            }

            if (state.phase === "bid" && state.bidder === mySeat) {
                actionPanel.innerHTML = `
                    <span>Licytujesz! Obecnie: <b>${state.highestBid}</b></span><br>
                    <button onclick="socket.emit('bid', {seat: ${mySeat}, amount: ${state.highestBid + 10}})">Licytuj ${state.highestBid + 10}</button>
                    <button class="btn-danger" onclick="socket.emit('bid', {seat: ${mySeat}, amount: 0})">PAS</button>
                `;
            } else if (state.phase === "exchange" && state.highestBidder === mySeat) {
                const otherSeats = [0,1,2,3].filter(s => s !== mySeat);
                actionPanel.innerHTML = `
                    <span>Wybierz 3 karty z ręki/musiku i oddaj graczom:</span><br>
                    <button onclick="confirmExchange([${otherSeats.join(',')}])">Przekaż wybrane (${selectedCards.length}/3)</button>
                `;
            } else if (state.phase === "play" && state.leader === mySeat) {
                actionPanel.innerHTML = `
                    <span>Twoja kolej na zagranie karty! Zaznacz kartę poniżej:</span><br>
                    <button onclick="playSelectedCard(false)">Zagraj Kartę</button>
                    <button onclick="playSelectedCard(true)">Meldunek K na Q</button>
                    <button onclick="socket.emit('makeMeld', {seat: ${mySeat}})">Zgłoś Meldunek</button>
                `;
            } else if (state.phase === "next" && amIHost) {
                actionPanel.innerHTML = `<button onclick="socket.emit('nextRound')">▶ Rozpocznij Następne Rozdanie</button>`;
            } else if (state.phase === "gameover" && amIHost) {
                actionPanel.innerHTML = `<button onclick="socket.emit('newGame')">🔄 Nowa Gra</button>`;
            }
        }

        function confirmExchange(recipients) {
            if (selectedCards.length !== 3) {
                alert('Musisz zaznaczyć dokładnie 3 karty!');
                return;
            }
            socket.emit('exchangeCards', { seat: mySeat, selectedIds: selectedCards, recipients });
            selectedCards = [];
        }

        function playSelectedCard(crossMeld) {
            if (selectedCards.length !== 1) {
                alert('Zaznacz dokładnie 1 kartę do zagrania!');
                return;
            }
            socket.emit('playCard', { seat: mySeat, cardId: selectedCards[0], crossMeld });
            selectedCards = [];
        }
    </script>
</body>
</html>
