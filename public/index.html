<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tysiąc – Gra Parami Real-time</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#083d30;color:#f7f0dc;font-family:Arial,Helvetica,sans-serif;}
button,select,input{font:inherit}
button{border:0;border-radius:9px;padding:9px 12px;background:#d8b45b;color:#21190d;font-weight:bold;cursor:pointer;}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:default}
.top{max-width:1450px;margin:auto;padding:12px;display:flex;justify-space:between;align-items:center;}
.brand{font-size:23px;font-weight:900;}
.sub{font-size:11px;opacity:.7;margin-top:3px;}
.layout{max-width:1450px;margin:auto;padding:0 12px 12px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;}
.table{position:relative;height:780px;overflow:hidden;border:2px solid #b9954c;border-radius:24px;background:radial-gradient(ellipse at center, #12664c 0%, #0b4938 52%, #062b23 100%);}
.player{position:absolute;width:180px;padding:8px;text-align:center;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:12px;}
.player.active{outline:3px solid #e8ca72;}
.player-1{left:50%;bottom:10px;transform:translateX(-50%);}
.player-3{left:50%;top:10px;transform:translateX(-50%);}
.player-2{left:10px;top:50%;transform:translateY(-50%);}
.player-4{right:10px;top:50%;transform:translateY(-50%);}
.center{position:absolute;left:50%;top:50%;width:430px;transform:translate(-50%,-50%);text-align:center;}
.status{padding:11px;background:rgba(0,0,0,.4);border-radius:12px;}
.musik{min-height:105px;display:flex;justify-content:center;align-items:center;gap:5px;}
.trick{min-height:160px;display:flex;justify-content:center;align-items:center;gap:9px;}
.trick-player{display:flex;flex-direction:column;align-items:center;}
.card{width:68px;height:94px;background:#fff9eb;color:#15120e;border:2px solid #d5c8aa;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.35);}
.card.red{color:#a51e25;}
.card-back{width:18px;height:27px;margin:2px;display:inline-flex;align-items:center;justify-content:center;background:#244f7e;color:white;border:2px solid #d7c69c;border-radius:4px;}
.hand{position:absolute;left:50%;bottom:105px;transform:translateX(-50%);display:flex;gap:6px;}
.hand .card{width:74px;height:102px;cursor:pointer;transition:transform .12s;}
.hand .card:hover{transform:translateY(-7px);}
.hand .selected{outline:3px solid #e8ca72;transform:translateY(-9px);}
.side{background:#07352b;border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:10px;display:flex;flex-direction:column;gap:9px;}
.box{background:rgba(0,0,0,.2);border-radius:12px;padding:10px;}
.scoreline{display:flex;justify-content:space-between;margin:5px 0;}
.log{max-height:130px;overflow:auto;font-size:12px;}
.chat{height:170px;overflow:auto;}
.chat-message{margin:5px 0;}
.chatbar{display:flex;gap:5px;}
.chatbar input{flex:1;min-width:0;padding:8px;border:0;border-radius:8px;}
#controls.bid-dock{position:absolute;left:50%;top:52px;width:430px;transform:translateX(-50%);z-index:8;padding:8px;background:rgba(5,35,28,.94);border:1px solid rgba(232,202,114,.55);border-radius:12px;}
#controls.exchange-dock{position:absolute;left:50%;bottom:calc(100% + 12px);width:430px;transform:translateX(-50%);z-index:9;padding:10px;background:rgba(5,35,28,.97);border:1px solid rgba(232,202,114,.65);border-radius:12px;}
.bid-buttons{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px;}
.bid-buttons button{min-width:0;padding:7px 2px;font-size:11px;}
.pass-button{width:100%;background:#a83333;color:white;padding:10px 8px;}
.musik .card.exchange-selectable{cursor:pointer;}
.musik .card.selected{outline:3px solid #e8ca72;}
</style>
</head>
<body>

<div class="top">
    <div>
        <div class="brand">🃏 Tysiąc – Gra Parami Real-time</div>
        <div class="sub" id="myRoleInfo">Łączenie z serwerem...</div>
    </div>
</div>

<div class="layout">
<main class="table">
    <div id="player1" class="player player-1"></div>
    <div id="player2" class="player player-2"></div>
    <div id="player3" class="player player-3"></div>
    <div id="player4" class="player player-4"></div>

    <div class="center">
        <div id="status" class="status"></div>
        <div id="musik" class="musik"></div>
        <div id="trick" class="trick"></div>
        <div id="controls"></div>
    </div>

    <div id="hand" class="hand"></div>
</main>

<aside class="side">
    <div class="box">
        <h3 style="margin-top:0">📊 Wynik</h3>
        <div class="scoreline"><b>🔵 Para 1</b><b id="score0">0</b></div>
        <div class="scoreline"><b>🔴 Para 2</b><b id="score1">0</b></div>
    </div>
    <div class="box">
        <b>📋 Info o grze</b>
        <div id="gameInfo" style="margin-top:6px;font-size:12px"></div>
    </div>
    <div class="box">
        <h3 style="margin:0 0 7px">📜 Akcje</h3>
        <div id="log" class="log"></div>
    </div>
    <div class="box">
        <h3 style="margin:0 0 7px">💬 Czat</h3>
        <div id="chat" class="chat"></div>
        <div class="chatbar">
            <input id="chatInput" placeholder="Napisz wiadomość…">
            <button onclick="sendChat()">➤</button>
        </div>
    </div>
</aside>
</div>

<script>
const socket = io();
const PLAYERS = ["Gracz 1", "Gracz 2", "Gracz 3", "Gracz 4"];
let state = null;
let selectedExchange = [];
let exchangeRecipients = {};

socket.on('assignedPlayer', (idx) => {
    document.getElementById('myRoleInfo').textContent = idx !== -1 
        ? `Grasz jako: ${PLAYERS[idx]} (Para ${(idx % 2) + 1})` 
        : 'Obserwator';
});

socket.on('gameState', (newState) => {
    state = newState;
    render();
});

function cardHTML(card) {
    return `<div class="card ${card.red ? "red" : ""}"><b>${card.rank}</b><span style="font-size:27px">${card.symbol}</span></div>`;
}

function selectCardExchange(id) {
    if (state.phase !== "exchange" || state.highestBidder !== state.myIndex) return;
    const idx = selectedExchange.indexOf(id);
    if (idx >= 0) {
        selectedExchange.splice(idx, 1);
        delete exchangeRecipients[id];
    } else if (selectedExchange.length < 3) {
        selectedExchange.push(id);
        exchangeRecipients[id] = null;
    }
    render();
}

function sendExchange() {
    const transfers = selectedExchange.map(id => ({ cardId: id, targetPlayer: exchangeRecipients[id] }));
    socket.emit('exchange', { transfers });
    selectedExchange = [];
    exchangeRecipients = {};
}

function sendChat() {
    const input = document.getElementById("chatInput");
    if (input.value.trim()) {
        socket.emit('sendChat', input.value.trim());
        input.value = "";
    }
}

function render() {
    if (!state) return;

    for (let i = 0; i < 4; i++) {
        const el = document.getElementById("player" + (i + 1));
        const active = (state.phase === "bid" && state.bidder === i) || (state.phase === "play" && state.leader === i);
        el.className = `player player-${i + 1}${active ? " active" : ""}`;
        el.innerHTML = `
            <b>${PLAYERS[i]} ${i === state.myIndex ? "🎮" : ""}</b><br>
            <small>Para ${(i % 2) + 1} ${state.passed.includes(i) ? "• PAS" : ""}</small>
        `;
    }

    const handEl = document.getElementById("hand");
    handEl.innerHTML = (state.myHand || []).map(card => `
        <div class="card ${card.red ? "red" : ""} ${selectedExchange.includes(card.id) ? "selected" : ""}" data-id="${card.id}">
            <b>${card.rank}</b><span style="font-size:27px">${card.symbol}</span>
        </div>
    `).join("");

    handEl.querySelectorAll('.card').forEach(el => {
        el.onclick = () => {
            const id = el.dataset.id;
            if (state.phase === "exchange") selectCardExchange(id);
            else if (state.phase === "play" && state.leader === state.myIndex) {
                socket.emit('playCard', { cardId: id, isCrossMeld: false });
            }
        };
    });

    const controls = document.getElementById("controls");
    controls.innerHTML = "";
    controls.className = state.phase === "bid" ? "bid-dock" : (state.phase === "exchange" ? "exchange-dock" : "");

    if (state.phase === "bid" && state.bidder === state.myIndex) {
        const passBtn = document.createElement("button");
        passBtn.className = "pass-button";
        passBtn.textContent = "🔴 PAS";
        passBtn.onclick = () => socket.emit('bid', 0);
        controls.appendChild(passBtn);

        const wrap = document.createElement("div");
        wrap.className = "bid-buttons";
        for (let amt = 110; amt <= 240; amt += 10) {
            const b = document.createElement("button");
            b.textContent = amt;
            b.disabled = amt <= state.highestBid;
            b.onclick = () => socket.emit('bid', amt);
            wrap.appendChild(b);
        }
        controls.appendChild(wrap);
    } 
    else if (state.phase === "exchange" && state.highestBidder === state.myIndex) {
        const b = document.createElement("button");
        b.textContent = `Zatwierdź przekazanie (${selectedExchange.length}/3)`;
        const isReady = selectedExchange.length === 3 && Object.values(exchangeRecipients).every(v => v !== null && v !== undefined);
        b.disabled = !isReady;
        b.onclick = sendExchange;
        controls.appendChild(b);
    }
    else if (state.phase === "next") {
        const b = document.createElement("button");
        b.textContent = "▶ Następne rozdanie";
        b.onclick = () => socket.emit('nextRound');
        controls.appendChild(b);
    }

    document.getElementById("trick").innerHTML = state.trick.map(p => `
        <div class="trick-player"><small>${PLAYERS[p.player]}</small>${cardHTML(p.card)}</div>
    `).join("");

    document.getElementById("score0").textContent = state.scores[0];
    document.getElementById("score1").textContent = state.scores[1];
    document.getElementById("log").innerHTML = state.log.map(l => `<div>${l}</div>`).join("");
    document.getElementById("chat").innerHTML = state.chat.map(c => `<div class="chat-message">${c}</div>`).join("");
}
</script>
</body>
</html>
