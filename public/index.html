<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tysiąc – Gra Parami Multi</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#083d30;color:#f7f0dc;font-family:Arial,sans-serif}
button,select{font:inherit;border:0;border-radius:8px;padding:8px 12px;background:#d8b45b;color:#21190d;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.4;cursor:default}
.layout{max-width:1400px;margin:auto;padding:12px;display:grid;grid-template-columns:1fr 300px;gap:12px}
.table{position:relative;height:720px;border:2px solid #b9954c;border-radius:20px;background:radial-gradient(ellipse at center, #12664c 0%, #062b23 100%)}
.player{position:absolute;width:160px;padding:8px;text-align:center;background:rgba(0,0,0,.4);border-radius:10px}
.player.active{outline:3px solid #e8ca72}
.player-0{left:50%;bottom:10px;transform:translateX(-50%)}
.player-2{left:50%;top:10px;transform:translateX(-50%)}
.player-1{left:10px;top:50%;transform:translateY(-50%)}
.player-3{right:10px;top:50%;transform:translateY(-50%)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:400px}
.hand{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);display:flex;gap:6px}
.card{width:64px;height:90px;background:#fff9eb;color:#15120e;border:2px solid #d5c8aa;border-radius:6px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;cursor:pointer}
.card.red{color:#a51e25}
.card.selected{outline:3px solid #e8ca72;transform:translateY(-8px)}
.side{background:#07352b;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}
.box{background:rgba(0,0,0,.2);padding:10px;border-radius:8px}
.pass-btn{background:#a83333;color:#fff;width:100%;margin-bottom:6px}
.bid-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
</style>
</head>
<body>

<div class="layout">
    <main class="table">
        <div id="p0" class="player player-0">Gracz 1</div>
        <div id="p1" class="player player-1">Gracz 2</div>
        <div id="p2" class="player player-2">Gracz 3</div>
        <div id="p3" class="player player-3">Gracz 4</div>

        <div class="center">
            <div id="status"></div>
            <div id="musik" style="margin:10px 0;display:flex;justify-content:center;gap:5px"></div>
            <div id="trick" style="display:flex;justify-content:center;gap:8px;min-height:100px"></div>
            <div id="controls"></div>
        </div>

        <div id="hand" class="hand"></div>
    </main>

    <aside class="side">
        <div class="box">
            <h3>📊 Wyniki</h3>
            <div>🔵 Para 1 (G1,G3): <b id="s0">0</b></div>
            <div>🔴 Para 2 (G2,G4): <b id="s1">0</b></div>
        </div>
        <div class="box">
            📜 <b>Logi</b>
            <div id="log" style="height:200px;overflow:auto;font-size:12px;margin-top:6px"></div>
        </div>
    </aside>
</div>

<script>
const socket = io();
let mySeat = null;
let selectedCards = [];
let exchangeTargets = {};
let localState = {};

const name = prompt("Podaj swój nick:") || "Gracz";
socket.emit('joinGame', name);

socket.on('assignedSeat', (seat) => {
    mySeat = seat;
});

socket.on('stateUpdate', (state) => {
    localState = state;
    render(state);
});

function render(state) {
    document.getElementById('s0').textContent = state.scores[0];
    document.getElementById('s1').textContent = state.scores[1];

    for(let i=0; i<4; i++) {
        const p = state.players[i];
        const el = document.getElementById('p' + i);
        if(p) {
            el.innerHTML = `<b>${p.name}</b><br><small>${p.hand.length} kart</small>`;
            el.className = `player player-${i} ${state.leader === i || state.bidder === i ? 'active' : ''}`;
        }
    }

    // Render Hand
    const handEl = document.getElementById('hand');
    handEl.innerHTML = '';
    const myHand = state.players[mySeat]?.hand || [];
    
    myHand.forEach(card => {
        const cardDiv = document.createElement('div');
        cardDiv.className = `card ${card.red ? 'red' : ''} ${selectedCards.includes(card.id) ? 'selected' : ''}`;
        cardDiv.innerHTML = `<span>${card.rank}</span><span>${card.symbol}</span>`;
        
        cardDiv.onclick = () => {
            if(state.phase === 'exchange' && state.highestBidder === mySeat) {
                toggleSelectCard(card.id);
            } else if(state.phase === 'play' && state.leader === mySeat) {
                socket.emit('playCard', { seat: mySeat, cardId: card.id, crossMeld: false });
            }
        };
        handEl.appendChild(cardDiv);
    });

    // Controls
    const ctrl = document.getElementById('controls');
    ctrl.innerHTML = '';

    if(state.phase === 'bid' && state.bidder === mySeat) {
        const passBtn = document.createElement('button');
        passBtn.className = 'pass-btn';
        passBtn.textContent = 'PAS';
        passBtn.onclick = () => socket.emit('bid', { seat: mySeat, amount: 0 });
        ctrl.appendChild(passBtn);

        const grid = document.createElement('div');
        grid.className = 'bid-grid';
        for(let amt = 110; amt <= 240; amt += 10) {
            if(amt > state.highestBid) {
                const b = document.createElement('button');
                b.textContent = amt;
                b.onclick = () => socket.emit('bid', { seat: mySeat, amount: amt });
                grid.appendChild(b);
            }
        }
        ctrl.appendChild(grid);
    }

    if(state.phase === 'exchange' && state.highestBidder === mySeat) {
        if(selectedCards.length === 3) {
            const confirmBtn = document.createElement('button');
            confirmBtn.textContent = 'Zatwierdź oddanie 3 kart';
            confirmBtn.onclick = () => {
                const targets = [ (mySeat+1)%4, (mySeat+2)%4, (mySeat+3)%4 ];
                socket.emit('exchangeCards', { seat: mySeat, selectedIds: selectedCards, recipients: targets });
                selectedCards = [];
            };
            ctrl.appendChild(confirmBtn);
        }
    }

    // Meldunek button
    if(state.phase === 'play' && state.leader === mySeat && state.trick.length === 1) {
        const meldBtn = document.createElement('button');
        meldBtn.textContent = '💍 Zgłoś Meldunek';
        meldBtn.onclick = () => socket.emit('makeMeld', { seat: mySeat });
        ctrl.appendChild(meldBtn);
    }

    // Logi
    document.getElementById('log').innerHTML = state.log.map(l => `<div>${l}</div>`).join('');
}

function toggleSelectCard(id) {
    const idx = selectedCards.indexOf(id);
    if(idx >= 0) selectedCards.splice(idx, 1);
    else if(selectedCards.length < 3) selectedCards.push(id);
    render(localState);
}
</script>
</body>
</html>
