<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tysiąc Multiplayer – Pokój Gry</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#083d30;color:#f7f0dc;font-family:sans-serif;}
.screen{display:none;padding:20px;}
.screen.active{display:block;}

/* FORMULARZE I LOBBY */
.login-box{max-width:400px;margin:40px auto;background:#07352b;padding:20px;border-radius:12px;border:1px solid #b9954c;}
.login-box h2{margin-top:0;}
input, button{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:0;font-size:15px;}
input{background:#04211a;color:#fff;border:1px solid #1a5e4d;}
button{background:#d8b45b;color:#111;font-weight:bold;cursor:pointer;}
button:hover{filter:brightness(1.1);}
.rooms-list{margin:15px 0;}
.room-item{background:rgba(0,0,0,0.3);padding:10px;margin:5px 0;border-radius:6px;display:flex;justify-space:between;align-items:center;}
.room-item button{width:auto;padding:5px 15px;margin:0;}

/* WIDOK GRY */
.layout{display:grid;grid-template-columns:1fr 300px;gap:10px;height:calc(100vh - 40px);}
.table{position:relative;background:#12664c;border:2px solid #b9954c;border-radius:15px;overflow:hidden;}
.player{position:absolute;padding:8px 15px;background:rgba(0,0,0,0.6);border-radius:8px;text-align:center;}
.player.active{border:2px solid #e8ca72;}
.p-0{bottom:15px;left:50%;transform:translateX(-50%);}
.p-1{left:15px;top:50%;transform:translateY(-50%);}
.p-2{top:15px;left:50%;transform:translateX(-50%);}
.p-3{right:15px;top:50%;transform:translateY(-50%);}
.hand{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);display:flex;gap:6px;}
.card{width:60px;height:90px;background:#fff;color:#000;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,0.4);font-size:18px;}
.card.red{color:#c00;}
.trick{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);display:flex;gap:10px;}
.side{background:#07352b;padding:12px;display:flex;flex-direction:column;gap:10px;border-radius:12px;}
.box{background:rgba(0,0,0,0.2);padding:10px;border-radius:8px;font-size:14px;}
#controls{position:absolute;top:62%;left:50%;transform:translateX(-50%);display:flex;gap:8px;}
#hostPanel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,0.8);padding:20px;border-radius:12px;}
</style>
</head>
<body>

<!-- WIDOK 1: LOBBY I LOGOWANIE -->
<div id="lobbyScreen" class="screen active">
    <div class="login-box">
        <h2>🃏 Dołącz do gry</h2>
        <label>Twój Nick:</label>
        <input type="text" id="playerNick" placeholder="np. Janusz">
        
        <label>PIN (4 cyfry):</label>
        <input type="password" id="playerPin" maxlength="4" placeholder="1234">

        <h3>Wybierz stół:</h3>
        <div id="roomsContainer" class="rooms-list"></div>

        <hr style="border-color:#1a5e4d;margin:15px 0;">
        <h3>Stwórz własny stół:</h3>
        <input type="text" id="newRoomName" placeholder="Nazwa Twojego stołu">
        <button onclick="createRoom()">➕ Stwórz Stół</button>
    </div>
</div>

<!-- WIDOK 2: GŁÓWNA GRA -->
<div id="gameScreen" class="screen">
    <div class="layout">
        <div class="table">
            <div id="p0" class="player p-0">Gracz 1</div>
            <div id="p1" class="player p-1">Gracz 2</div>
            <div id="p2" class="player p-2">Gracz 3</div>
            <div id="p3" class="player p-3">Gracz 4</div>

            <div id="hostPanel" style="display:none;">
                <h3>Oczekiwanie na graczy... (<span id="playerCount">0</span>/4)</h3>
                <button id="startBtn" onclick="startGame()">🚀 Rozpocznij grę</button>
            </div>

            <div id="trick" class="trick"></div>
            <div id="controls"></div>
            <div id="hand" class="hand"></div>
        </div>

        <div class="side">
            <div class="box">
                <h4 style="margin:0 0 8px 0;">Stół: <span id="tableName">-</span></h4>
                <div>Para 1: <b id="s0">0</b> pkt</div>
                <div>Para 2: <b id="s1">0</b> pkt</div>
            </div>
            <div class="box" style="flex:1;overflow:auto;" id="log"></div>
        </div>
    </div>
</div>

<script>
const socket = io();
let myIdx = -1;
let currentRoomId = null;

socket.on('errorMsg', msg => alert(msg));

socket.on('roomsList', rooms => {
    const container = document.getElementById('roomsContainer');
    container.innerHTML = rooms.map(r => `
        <div class="room-item">
            <div>
                <b>${r.name}</b><br>
                <small>Graczy: ${r.count}/4 ${r.started ? '(W trakcie)' : ''}</small>
            </div>
            <button onclick="joinRoom('${r.id}')" ${r.count >= 4 || r.started ? 'disabled' : ''}>Dołącz</button>
        </div>
    `).join('');
});

function getAuthData() {
    return {
        nick: document.getElementById('playerNick').value.trim(),
        pin: document.getElementById('playerPin').value.trim()
    };
}

function joinRoom(roomId) {
    const auth = getAuthData();
    socket.emit('loginAndJoin', { ...auth, roomId });
}

function createRoom() {
    const auth = getAuthData();
    const name = document.getElementById('newRoomName').value.trim();
    socket.emit('createRoom', { ...auth, name });
}

function startGame() {
    socket.emit('startGame');
}

socket.on('joinSuccess', ({ roomId }) => {
    currentRoomId = roomId;
    document.getElementById('lobbyScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
    document.getElementById('tableName').textContent = roomId;
});

socket.on('gameState', state => {
    myIdx = state.myIndex;

    // Aktualizacja Graczy na stole
    for (let i = 0; i < 4; i++) {
        const pEl = document.getElementById(`p${i}`);
        const pData = state.playersList[i];
        
        if (pData) {
            pEl.innerHTML = `<b>${pData.nick}</b> ${pData.isHost ? '👑' : ''}<br><small>Para ${(i%2)+1}</small>`;
        } else {
            pEl.innerHTML = `<i>Wolne miejsce</i>`;
        }

        pEl.className = `player p-${i}` + ((state.phase === 'bid' && state.bidder === i) || (state.phase === 'play' && state.leader === i) ? ' active' : '');
    }

    // Panel Startu Gospodarza
    const hostPanel = document.getElementById('hostPanel');
    const connectedCount = state.playersList.filter(Boolean).length;
    document.getElementById('playerCount').textContent = connectedCount;

    if (!state.gameStarted) {
        hostPanel.style.display = 'block';
        const isMeHost = state.playersList[myIdx] && state.playersList[myIdx].isHost;
        document.getElementById('startBtn').style.display = isMeHost ? 'block' : 'none';
    } else {
        hostPanel.style.display = 'none';
    }

    // Punkty
    document.getElementById('s0').textContent = state.scores[0];
    document.getElementById('s1').textContent = state.scores[1];

    // Ręka gracza
    const hand = document.getElementById('hand');
    hand.innerHTML = (state.myHand || []).map(c => `
        <div class="card ${c.red ? 'red':''}" onclick="playCard('${c.id}')">
            <span>${c.rank}</span><span>${c.symbol}</span>
        </div>
    `).join('');

    // Lewa na stole
    document.getElementById('trick').innerHTML = (state.trick || []).map(t => `
        <div class="card ${t.card.red ? 'red':''}">
            <span>${t.card.rank}</span><span>${t.card.symbol}</span>
        </div>
    `).join('');

    // Akcje licytacji
    const ctr = document.getElementById('controls');
    ctr.innerHTML = '';
    if (state.phase === 'bid' && state.bidder === myIdx) {
        ctr.innerHTML = `
            <button onclick="bid(0)">PAS</button>
            <button onclick="bid(${state.highestBid + 10})">${state.highestBid + 10}</button>
        `;
    }

    // Dziennik zdarzeń
    document.getElementById('log').innerHTML = (state.log || []).map(l => `<div>${l}</div>`).join('');
});

function bid(amt) { socket.emit('bid', amt); }
function playCard(id) { socket.emit('playCard', { cardId: id }); }
</script>
</body>
</html>
