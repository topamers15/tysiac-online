<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tysiąc Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; touch-action: manipulation; }
        body { background: #121c13; color: #fff; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Ekran logowania */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 999; padding: 20px; }
        .login-box { background: #233325; padding: 25px; border-radius: 16px; text-align: center; border: 1px solid #3d5742; max-width: 320px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .login-box input { padding: 12px; border-radius: 8px; border: 1px solid #3d5742; background: #121c13; color: white; font-size: 16px; margin-bottom: 15px; width: 100%; text-align: center; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #4a8264; color: white; font-weight: bold; font-size: 16px; }

        /* Główny kontener - Układ RWD */
        #gameContainer { display: flex; flex: 1; height: 100vh; overflow: hidden; }
        #mainBoard { flex: 1; background: #1e2b20; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow-y: auto; }
        #sidebar { width: 300px; background: #172218; padding: 12px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid #2e4532; overflow-y: auto; }

        /* Pasek nagłówka */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px; }
        .top-bar h4 { margin: 0; font-size: 15px; }
        .top-bar small { color: #a5c4ab; }

        /* Stół i Lewa */
        .trick-area { min-height: 120px; background: rgba(0,0,0,0.25); border-radius: 12px; border: 1.5px dashed #3d5742; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 10px; margin: 10px 0; flex-wrap: wrap; }

        /* Ręka gracza i Karty */
        .cards-flex { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding-bottom: 5px; }
        .card { width: 58px; height: 86px; background: #fff; color: #111; border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; padding: 4px; font-weight: bold; font-size: 15px; cursor: pointer; user-select: none; box-shadow: 0 3px 6px rgba(0,0,0,0.4); transition: transform 0.15s, border 0.15s; position: relative; }
        .card.red { color: #d32f2f; }
        .card.selected { border: 3px solid #ffb74d; transform: translateY(-10px); }

        /* Panele Sterowania */
        .controls { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 8px; font-size: 13px; }
        button { padding: 8px 14px; border-radius: 6px; border: none; background: #3d6b4f; color: white; font-weight: bold; cursor: pointer; margin: 3px; font-size: 13px; }
        button:active { opacity: 0.8; }
        .btn-danger { background: #a83232; }

        /* Komponenty Bocznego Panela */
        .score-board { background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
        .player-list-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #2e4532; font-size: 13px; }
        .chat-box { flex: 1; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; min-height: 140px; }
        .chat-messages { flex: 1; overflow-y: auto; font-size: 12px; max-height: 120px; display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
        .chat-input { display: flex; gap: 4px; }
        .chat-input input { flex: 1; padding: 6px; border-radius: 4px; border: none; background: #233325; color: white; font-size: 12px; }
        .log-box { height: 80px; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 6px; font-size: 11px; overflow-y: auto; color: #a5c4ab; }

        /* ================= RESPONSYWNOŚĆ DLA SMARTFONÓW ================= */
        @media (max-width: 768px) {
            #gameContainer { flex-direction: column; overflow-y: auto; }
            #mainBoard { min-height: auto; flex: none; }
            #sidebar { width: 100%; border-left: none; border-top: 2px solid #2e4532; flex: none; }
            .card { width: 50px; height: 75px; font-size: 13px; padding: 3px; }
            .trick-area { min-height: 100px; }
            body { overflow-y: auto; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>Gra Tysiąc</h2>
            <input type="text" id="usernameInput" placeholder="Twoje imię" maxlength="12">
            <button onclick="login()">Dołącz do gry</button>
        </div>
    </div>

    <div id="gameContainer">
        <div id="mainBoard">
            <!-- Nagłówek Stanu -->
            <div class="top-bar">
                <div>
                    <h4>Runda <span id="roundNum">1</span></h4>
                    <small>Atut: <b id="trumpSuit">Brak</b></small>
                </div>
                <div id="gameStatus" style="font-weight: bold; color: #ffb74d; font-size: 13px;">Oczekiwanie...</div>
            </div>

            <!-- Stół / Musik / Lewa -->
            <div>
                <div style="text-align: center; margin-top: 5px;"><small style="color: #a5c4ab;">Stół / Musik:</small></div>
                <div class="trick-area" id="trickArea"></div>
            </div>

            <!-- Panel Akcji i Karta Gracza -->
            <div>
                <div id="actionPanel" class="controls"></div>
                <div style="text-align: center; margin-bottom: 4px;"><small style="color: #a5c4ab;">Twoje karty:</small></div>
                <div class="cards-flex" id="myHand"></div>
            </div>
        </div>

        <!-- Panel Boczny -->
        <div id="sidebar">
            <div class="score-board">
                <div style="display:flex; justify-content:space-between;">
                    <span>Para 1 (P1/P3): <b id="scoreTeam0">0</b></span>
                    <span>Para 2 (P2/P4): <b id="scoreTeam1">0</b></span>
                </div>
            </div>

            <div>
                <div style="font-weight:bold; margin-bottom: 4px; font-size:13px;">Gracze:</div>
                <div id="hostPlayerList"></div>
            </div>

            <div class="chat-box">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()">></button>
                </div>
            </div>

            <div>
                <div style="font-weight:bold; margin-bottom: 2px; font-size:12px;">Dziennik gry:</div>
                <div class="log-box" id="logBox"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let mySeat = -1;
        let selectedCards = [];

        function login() {
            const name = document.getElementById('usernameInput').value.trim();
            if (name) {
                socket.emit('joinGame', name);
                document.getElementById('loginOverlay').style.display = 'none';
            }
        }

        socket.on('assignedSeat', (seat) => {
            mySeat = seat;
        });

        socket.on('fullGame', () => {
            alert('Gra jest pełna!');
            location.reload();
        });

        socket.on('kicked', () => {
            alert('Zostałeś usunięty przez Hosta.');
            location.reload();
        });

        socket.on('stateUpdate', (state) => {
            render(state);
        });

        function sendChat() {
            const input = document.getElementById('chatInput');
            if (input.value.trim()) {
                socket.emit('sendChat', input.value);
                input.value = '';
            }
        }

        function toggleCardSelect(cardId) {
            const index = selectedCards.indexOf(cardId);
            if (index > -1) {
                selectedCards.splice(index, 1);
            } else {
                if (selectedCards.length < 3) {
                    selectedCards.push(cardId);
                }
            }
            const cardEls = document.querySelectorAll('#myHand .card');
            cardEls.forEach(el => {
                const id = el.getAttribute('data-id');
                if (selectedCards.includes(id)) el.classList.add('selected');
                else el.classList.remove('selected');
            });
        }

        function render(state) {
            const me = state.players.find(p => p.seat === mySeat);
            const amIHost = me ? me.isHost : false;

            document.getElementById('roundNum').innerText = state.round;
            document.getElementById('trumpSuit').innerText = state.trump || "Brak";
            document.getElementById('scoreTeam0').innerText = state.scores[0];
            document.getElementById('scoreTeam1').innerText = state.scores[1];

            // Renderowanie listy graczy
            const hostListEl = document.getElementById('hostPlayerList');
            let listHTML = state.players.map(p => `
                <div class="player-list-item">
                    <span>${p.isBot ? '🤖' : '👤'} ${p.name} ${p.isHost ? '👑' : ''} ${p.seat === mySeat ? '(Ty)' : ''}</span>
                    ${amIHost && p.seat !== mySeat ? `<button style="font-size:10px;padding:2px 6px;" class="btn-danger" onclick="socket.emit('kickPlayer', ${p.seat})">Usuń</button>` : ''}
                </div>
            `).join('');

            if (amIHost && state.players.length < 4) {
                listHTML += `<button style="width:100%;margin-top:6px;background:#4a8264;" onclick="socket.emit('addBot')">🤖 ➕ Dodaj Bota</button>`;
            }
            if (amIHost) {
                listHTML += `<button style="width:100%;margin-top:4px;background:#2e4532;" onclick="socket.emit('togglePause')">${state.paused ? '▶ Wzłów' : '⏸ Pauza'}</button>`;
            }

            hostListEl.innerHTML = listHTML;

            // Czat i Dziennik
            const chatEl = document.getElementById('chatMessages');
            chatEl.innerHTML = state.chat.map(c => `<div>${c}</div>`).join('');
            chatEl.scrollTop = chatEl.scrollHeight;

            const logEl = document.getElementById('logBox');
            logEl.innerHTML = state.log.map(l => `<div>${l}</div>`).join('');

            // Status gry
            const statusEl = document.getElementById('gameStatus');
            if (state.paused) statusEl.innerText = "PAUZA";
            else if (state.phase === "waiting") statusEl.innerText = "Oczekiwanie...";
            else if (state.phase === "bid") statusEl.innerText = `Licytacja (${state.players[state.bidder]?.name})`;
            else if (state.phase === "show_musik") statusEl.innerText = `Podgląd musiku (10s)...`;
            else if (state.phase === "exchange") statusEl.innerText = `Wymiana (${state.players[state.highestBidder]?.name})`;
            else if (state.phase === "play") statusEl.innerText = `Ruch: ${state.players[state.leader]?.name}`;
            else if (state.phase === "next") statusEl.innerText = "Koniec rozdania";

            // Lewa / Musik na stole
            const trickArea = document.getElementById('trickArea');
            if (state.phase === "exchange" || state.phase === "show_musik") {
                trickArea.innerHTML = state.musik.map(c => `
                    <div class="card ${c.red ? 'red' : ''}">
                        <div>${c.rank}</div>
                        <div style="text-align:center;">${c.symbol}</div>
                        <div style="text-align:right;">${c.rank}</div>
                    </div>
                `).join('');
            } else {
                trickArea.innerHTML = state.trick.map(t => `
                    <div style="text-align:center;">
                        <div style="font-size:10px;margin-bottom:2px;color:#a5c4ab;">${state.players[t.player].name}</div>
                        <div class="card ${t.card.red ? 'red' : ''}">
                            <div>${t.card.rank}</div>
                            <div style="text-align:center;">${t.card.symbol}</div>
                            <div style="text-align:right;">${t.card.rank}</div>
                        </div>
                    </div>
                `).join('');
            }

            // Moja Ręka
            const myHandEl = document.getElementById('myHand');
            if (me && me.hand) {
                myHandEl.innerHTML = me.hand.map(c => `
                    <div class="card ${c.red ? 'red' : ''} ${selectedCards.includes(c.id) ? 'selected' : ''}" data-id="${c.id}" onclick="toggleCardSelect('${c.id}')">
                        <div>${c.rank}</div>
                        <div style="text-align:center;">${c.symbol}</div>
                        <div style="text-align:right;">${c.rank}</div>
                    </div>
                `).join('');
            } else {
                myHandEl.innerHTML = '';
            }

            // Panel Akcji
            const actionPanel = document.getElementById('actionPanel');
            actionPanel.innerHTML = '';

            if (state.paused) {
                actionPanel.innerHTML = '<i>Gra zapauzowana</i>';
                return;
            }

            if (state.phase === "bid" && state.bidder === mySeat) {
                actionPanel.innerHTML = `
                    <div>Licytujesz! Oferta: <b>${state.highestBid}</b></div>
                    <button onclick="socket.emit('bid', {seat: ${mySeat}, amount: ${state.highestBid + 10}})">+10 (${state.highestBid + 10})</button>
                    <button class="btn-danger" onclick="socket.emit('bid', {seat: ${mySeat}, amount: 0})">PAS</button>
                `;
            } else if (state.phase === "exchange" && state.highestBidder === mySeat) {
                const otherSeats = [0,1,2,3].filter(s => s !== mySeat);
                actionPanel.innerHTML = `
                    <div>Zaznacz 3 karty i oddaj:</div>
                    <button onclick="confirmExchange([${otherSeats.join(',')}])">Oddaj karty (${selectedCards.length}/3)</button>
                `;
            } else if (state.phase === "play" && state.leader === mySeat) {
                actionPanel.innerHTML = `
                    <div>Twoja kolej!</div>
                    <button onclick="playSelectedCard(false)">Zagraj</button>
                    <button onclick="playSelectedCard(true)">Meldunek K/Q</button>
                    <button onclick="socket.emit('makeMeld', {seat: ${mySeat}})">Zgłoś Meldunek</button>
                `;
            } else if (state.phase === "next" && amIHost) {
                actionPanel.innerHTML = `<button onclick="socket.emit('nextRound')">▶ Następne Rozdanie</button>`;
            } else if (state.phase === "gameover" && amIHost) {
                actionPanel.innerHTML = `<button onclick="socket.emit('newGame')">🔄 Nowa Gra</button>`;
            }
        }

        function confirmExchange(recipients) {
            if (selectedCards.length !== 3) {
                alert('Zaznacz dokładnie 3 karty!');
                return;
            }
            socket.emit('exchangeCards', { seat: mySeat, selectedIds: selectedCards, recipients });
            selectedCards = [];
        }

        function playSelectedCard(crossMeld) {
            if (selectedCards.length !== 1) {
                alert('Zaznacz 1 kartę!');
                return;
            }
            socket.emit('playCard', { seat: mySeat, cardId: selectedCards[0], crossMeld });
            selectedCards = [];
        }
    </script>
</body>
</html>
